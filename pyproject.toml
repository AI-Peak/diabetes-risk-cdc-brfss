[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-risk-cdc"
version = "1.0.0"
description = "Predicting Diabetes Risk Using CDC Health Indicators: Interpretable Machine Learning, Evidence Alignment, and Evaluation Integrity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "joblib>=1.3.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
